<style>
  :root{
    --bg:#05070a; --ink:#e9eff4; --dim:#8d9aa5;
    --bone:#dfe7ec; --steel:#a9bcc9;
    --red:#c8452f; --red-dim:rgba(200,69,47,.4);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Roboto Mono",monospace;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  body{overscroll-behavior:none}
  #stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #stage.dragging{cursor:grabbing}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(115% 85% at 50% 44%,transparent 34%,rgba(0,0,0,.62) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;
    background:radial-gradient(70% 60% at 58% 42%,rgba(214,235,255,.5),rgba(140,175,205,.16) 45%,transparent 72%)}
  #flash.hit{animation:flashZ .55s ease-out}
  @keyframes flashZ{0%{opacity:1}18%{opacity:.55}100%{opacity:0}}

  /* ---------- top HUD ---------- */
  .hud-top{position:fixed;top:0;left:0;right:0;z-index:7;display:flex;align-items:flex-start;
    justify-content:space-between;gap:16px;padding:18px 22px;
    padding-top:max(18px,env(safe-area-inset-top));pointer-events:none}
  .home{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#cdd9e1;
    background:rgba(6,9,12,.5);border:1px solid rgba(210,224,235,.16);padding:7px 13px 7px 11px;
    border-radius:2px;backdrop-filter:blur(8px);transition:.2s}
  .home:hover{color:#fff;border-color:rgba(210,224,235,.42);background:rgba(14,19,25,.68)}
  .home svg{display:block;color:var(--red)}
  .hud-left{display:flex;flex-direction:column;align-items:flex-start;gap:9px}
  .hint{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:#6b7883;text-transform:uppercase;
    margin-top:10px;text-align:right}
  #sound{pointer-events:auto;position:fixed;right:20px;bottom:16px;z-index:7;font-family:var(--mono);
    font-size:10px;letter-spacing:.18em;color:#6f7d88;background:rgba(6,9,12,.55);border:1px solid rgba(210,224,235,.14);
    padding:7px 10px;border-radius:2px;cursor:pointer;transition:.2s}
  #sound:hover{color:var(--bone);border-color:rgba(210,224,235,.4)}
  #sound.waiting{color:#e2b6a8;border-color:rgba(200,69,47,.55);animation:soundPulse 2.4s ease-in-out infinite}
  @keyframes soundPulse{0%,100%{box-shadow:0 0 0 0 rgba(200,69,47,0)}50%{box-shadow:0 0 0 4px rgba(200,69,47,.14)}}

  /* ---------- technique panel ---------- */
  .panel{position:fixed;z-index:6;left:0;top:0;bottom:0;width:368px;padding:94px 34px 28px 30px;
    display:flex;flex-direction:column;justify-content:center;pointer-events:none;
    background:linear-gradient(100deg,rgba(4,6,9,.95) 30%,rgba(4,6,9,.8) 66%,rgba(4,6,9,0) 100%);
    opacity:0;transform:translateX(-16px);transition:opacity .55s ease,transform .55s cubic-bezier(.16,.84,.24,1)}
  .panel.on{opacity:1;transform:none}
  .panel::before{content:"";position:absolute;left:0;top:96px;bottom:34px;width:1px;
    background:linear-gradient(180deg,transparent,var(--red),rgba(200,69,47,.12) 70%,transparent)}
  .p-head{display:flex;align-items:center;gap:11px;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.28em;text-transform:uppercase;color:#b9c7d1}
  .p-head span:first-child{color:var(--red)}
  .p-head i{flex:1;height:1px;background:linear-gradient(90deg,rgba(210,224,235,.34),transparent)}
  .panel h1{font-family:var(--serif);font-size:38px;line-height:1.02;letter-spacing:-.02em;margin:14px 0 6px;font-weight:500}
  .panel h1 em{font-style:italic;color:var(--red)}
  .p-sub{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:#77858f;text-transform:uppercase;margin-bottom:16px}
  .p-body{max-height:min(56vh,520px);overflow:auto;padding-right:6px;scrollbar-width:thin}
  .sec{margin:0 0 15px}
  .sec>b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.26em;color:#707d87;
    text-transform:uppercase;margin-bottom:6px}
  .sec p,.sec li{font-size:13.5px;line-height:1.64;color:#cdd8e0;margin:0 0 6px}
  .sec ul{margin:0;padding-left:0;list-style:none}
  .sec li{padding-left:16px;position:relative}
  .sec li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:1px;background:rgba(200,69,47,.75)}
  .w{display:inline-block;opacity:0;transform:translateY(6px);filter:blur(4px);margin-right:.28em;
    animation:wordIn .5s cubic-bezier(.16,.84,.24,1) forwards}
  @keyframes wordIn{to{opacity:1;transform:none;filter:none}}

  /* ---------- nodes ---------- */
  #nodes{position:fixed;inset:0;z-index:5;pointer-events:none}
  .node{position:absolute;pointer-events:auto;cursor:pointer;background:rgba(8,11,15,.5);
    border:0;border-left:2px solid rgba(200,69,47,.55);
    padding:7px 12px 7px 10px;display:flex;align-items:center;gap:9px;
    backdrop-filter:blur(8px);box-shadow:0 6px 22px rgba(0,0,0,.35),inset 0 0 0 1px rgba(214,228,238,.10);
    transition:transform .25s cubic-bezier(.16,.84,.24,1),box-shadow .25s,background .25s}
  .node:hover{transform:translateY(-2px);background:rgba(14,19,25,.66);
    box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 0 0 1px rgba(214,228,238,.28)}
  .node.on{background:rgba(30,12,10,.7);border-left-color:var(--red);
    box-shadow:0 8px 26px rgba(0,0,0,.5),inset 0 0 0 1px rgba(200,69,47,.55)}
  .node .code{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:rgba(200,69,47,.95)}
  .node .nm{font-size:12.5px;letter-spacing:.02em;color:#e6eef3;white-space:nowrap}
  .node .nm small{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:#6d7a85;
    text-transform:uppercase;margin-top:2px}
  .node.on .nm{color:#fff}
  .node.on .nm small{color:#a0817b}
  .node.guard{border-left-color:rgba(214,228,238,.4)}
  .node.guard.on{background:rgba(12,16,21,.75);border-left-color:var(--bone)}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .hud-top{padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
    .home{font-size:9px;letter-spacing:.2em;padding:6px 11px 6px 9px}
    .hint{font-size:8px;letter-spacing:.1em}
    /* the technique panel stays in the markup for SEO, but must not cover the
       stage on small screens — hidden visually, still readable by crawlers */
    .panel,.panel.on{position:absolute;left:0;top:0;width:1px;height:1px;max-height:none;
      padding:0;margin:-1px;overflow:hidden;background:none;opacity:1;transform:none;
      clip:rect(0 0 0 0);clip-path:inset(50%);white-space:normal;pointer-events:none}
    .panel::before{display:none}
    .node{padding:6px 9px 6px 7px;gap:6px}
    .node .nm{font-size:10.5px}
    .node .nm small{display:none}
    .node .code{font-size:8.5px}
    #sound{right:14px;bottom:auto;top:max(12px,env(safe-area-inset-top));font-size:9px;padding:6px 9px}
  }
</style>
