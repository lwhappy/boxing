<header class="site-head">
  <div class="wrap">
    <a class="logo" href="./index.html" aria-label="SilentJab home">
      <span class="logo-mark" aria-hidden="true">
        <img src="./assets/img/glove.png" srcset="./assets/img/glove.png 1x, ./assets/img/glove@2x.png 2x, ./assets/img/glove@3x.png 3x" alt="" width="30" height="20">

    </ol>
  </div>
</nav>
<script src="./assets/site-nav.js"></script>

<main class="fight-main">
  <p class="fight-message" id="fight-message" hidden></p>

  <div class="fight-stage" aria-label="3D fight demo">
    <canvas id="fight-canvas"></canvas>

    <!-- Sound toggle — top-left of the stage. State is remembered in
         localStorage under "silentjab.fight.muted". -->
    <button class="fight-sound" id="fight-sound" type="button"
            title="Toggle hit sound" aria-label="Hit sound" aria-pressed="true" hidden>
      <svg class="ico ico-on" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6.6 8.9H3.4v6.2h3.2L11 19z"/>
        <path d="M15.2 9.1a4.3 4.3 0 0 1 0 5.8"/>
        <path d="M18 6.4a8.2 8.2 0 0 1 0 11.2"/>
      </svg>
      <svg class="ico ico-off" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6.6 8.9H3.4v6.2h3.2L11 19z"/>
        <path d="m15.6 9.6 5 5m0-5-5 5"/>
      </svg>
      <span class="txt">Sound</span>
    </button>

    <button class="fight-next" id="fight-next" type="button"
            title="Load the next animation"
            aria-label="Next animation" hidden>
      <span class="ico" aria-hidden="true">→</span><span class="txt">Next</span>
    </button>
    <div class="fight-orbit-hint" aria-hidden="true">Drag to rotate · Scroll to zoom</div>
    <div class="fight-loading" id="fight-loading">
      <div class="ring"></div>
      <span id="fight-loading-text">Loading 3D model…</span>
    </div>
    <div class="fight-error" id="fight-error" hidden></div>
  </div>

  <div class="fight-bar" id="fight-bar" role="toolbar" aria-label="Punch buttons" hidden></div>
</main>

<footer class="site-foot">
  <span>© 2026 SilentJab — technique reference for striking sports.</span>
