<main class="wrap fight-main">

    <canvas id="fight-canvas"></canvas>
    <div class="fight-loading" id="fight-loading">
      <div class="ring"></div>
      <span id="fight-loading-text">Loading fight model…</span>
    </div>
    <div class="fight-error" id="fight-error" hidden></div>
  </div>

  <p class="fight-description" id="fight-description"></p>

  <div class="fight-bar" id="fight-bar" role="toolbar" aria-label="Punch buttons" hidden></div>

</main>

<!-- Fight page config: scenes are dynamic — add/edit scenes here.
     Each scene:
       glb:          path to the GLB file (relative to this page)
       label:        short scene name shown above the stage
       active:       array of button numbers that are enabled (1-6)
       description:  explanatory text shown below the stage
     GLB clip naming:
       defence-idle   — defence character idle loop
       attack-idle    — attack character idle loop
       attack-{key}  — attack punch (e.g. attack-jab, attack-cross) -->
<script>
window.FIGHT = {
  scenes: [
    {
      glb: 'fight/glb/med-head-jab.glb',
      label: 'Medium Head Jab',
      active: [1],
      description: 'A focused drill on the jab to the head. The defender holds guard while the attacker throws the jab — press the Jab button to fire it.'
    }
  ]
};
</script>
<script type="module" src="./assets/fight-stage.js?v=4"></script>
